name: Deploy VIPRemesas (Cloudflare Workers)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://nczavdcqueebhhtkuasv.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rxqHb79-KneH3UZGHj2fDA_5ofGaUds
  VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
  VITE_PIX_KEY: ${{ vars.VITE_PIX_KEY }}

jobs:
  deploy:
    name: Build and Deploy VIPRemesas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Corregir PIX de remesas
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path("src/routes/_authenticated/send.tsx"),
              Path("portable-export/src/routes/_authenticated/send.tsx"),
          ]

          old_main = '''setTracking(res.trackingId);\n      // For BR, PIX must come exclusively from Mercado Pago.\n      setPixCode(null);\n      setTxId(res.transactionId);\n      setStep(6);\n      if (origin !== "BR") openWhatsApp(res.trackingId);'''
          new_main = '''setTracking(res.trackingId);\n      setTxId(res.transactionId);\n\n      // Brasil: crear inmediatamente el PIX dinámico de Mercado Pago.\n      // Nunca usamos una llave PIX fija o generada localmente para remesas.\n      if (origin === "BR") {\n        setPixCode(null);\n        const mp = await createMpPreference({ data: { transactionId: res.transactionId } });\n        if (!mp.pixCode) throw new Error("Mercado Pago no devolvió el código PIX de esta orden.");\n        setPixCode(mp.pixCode);\n      } else {\n        setPixCode(res.pixCode);\n      }\n\n      setStep(6);\n      if (origin !== "BR") openWhatsApp(res.trackingId);'''

          old_portable_import = '  findRate, calcQuote, generatePixCode,\n'
          new_portable_import = '  findRate, calcQuote,\n'
          old_portable_code = '  const pixPayCode = pixCode ?? (amountNum > 0 ? generatePixCode(tracking ?? "vip", amountNum) : null);'
          new_portable_code = '  const pixPayCode = pixCode;'
          old_portable_order = '''setTracking(res.trackingId);\n      setTxId(res.transactionId);\n\n      // Brasil: el código PIX que verá el cliente sale directamente de Mercado Pago.\n      // No redirigimos al checkout de Mercado Pago: mostramos QR + Copia y Cola.\n      if (origin === "BR") {\n        const mp = await createMpPreference({ data: { transactionId: res.transactionId } });\n        setPixCode(mp.pixCode);\n      } else {\n        setPixCode(res.pixCode);\n      }\n\n      setStep(6);\n      if (origin !== "BR") openWhatsApp(res.trackingId);'''
          new_portable_order = '''setTracking(res.trackingId);\n      setTxId(res.transactionId);\n      setPixCode(null);\n\n      // Brasil: el PIX se crea ahora mismo en Mercado Pago y se muestra\n      // directamente en esta pantalla. Nunca usamos una llave fija/local.\n      if (origin === "BR") {\n        const mp = await createMpPreference({ data: { transactionId: res.transactionId } });\n        if (!mp.pixCode) throw new Error("Mercado Pago no devolvió el código PIX de esta orden.");\n        setPixCode(mp.pixCode);\n      } else {\n        setPixCode(res.pixCode);\n      }\n\n      setStep(6);\n      if (origin !== "BR") openWhatsApp(res.trackingId);'''

          changed = False
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text()
              original = text
              if path.as_posix().startswith("portable-export/"):
                  text = text.replace(old_portable_import, new_portable_import)
                  text = text.replace(old_portable_code, new_portable_code)
                  text = text.replace(old_portable_order, new_portable_order)
              else:
                  text = text.replace(old_main, new_main)
              if text != original:
                  path.write_text(text)
                  changed = True

          for path in files:
              if path.exists() and "generatePixCode" in path.read_text():
                  raise SystemExit(f"ERROR: generatePixCode sigue en {path}")

          if changed:
              print("PIX remittance flow corrected")
          else:
              print("PIX remittance flow already corrected")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/send.tsx portable-export/src/routes/_authenticated/send.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Fix direct Mercado Pago PIX for remittances"
            git push
          fi

      - name: Detectar carpeta de la aplicación
        run: |
          if [ -f portable-export/wrangler.jsonc ]; then
            echo "APP_DIR=portable-export" >> "$GITHUB_ENV"
          elif [ -f wrangler.jsonc ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: No encuentro wrangler.jsonc"
            exit 1
          fi

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verificar variables públicas
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "ERROR: Falta NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "ERROR: Falta NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          if [ "$NEXT_PUBLIC_SUPABASE_URL" != "https://nczavdcqueebhhtkuasv.supabase.co" ]; then
            echo "ERROR: NEXT_PUBLIC_SUPABASE_URL no apunta al proyecto configurado."
            exit 1
          fi

      - name: Verificar credenciales
        id: cloudflare-config
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "ERROR: Falta SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "ERROR: Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$RAW_CLOUDFLARE_ACCOUNT_ID" || { echo "ERROR: Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n\t ' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          printf '%s' "$ACCOUNT_ID" | grep -Eq '^[A-Za-z0-9_-]+$' || { echo "ERROR: CLOUDFLARE_ACCOUNT_ID inválido"; exit 1; }
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        run: |
          cd "$APP_DIR"
          bun install

      - name: Compilar producción
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd "$APP_DIR"
          bun run build

      - name: Verificar build y seguridad
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd "$APP_DIR"
          test -d dist/client || { echo "ERROR: No existe dist/client"; exit 1; }
          if grep -rqF "uoglxwtritcsrglwimej" dist/client; then
            echo "ERROR: El build contiene el proyecto Supabase antiguo."
            exit 1
          fi
          grep -rqF "https://nczavdcqueebhhtkuasv.supabase.co" dist/client || { echo "ERROR: No aparece el proyecto Supabase configurado."; exit 1; }
          if grep -rqF "$SUPABASE_SERVICE_ROLE_KEY" dist/client; then
            echo "ERROR CRÍTICO: La clave administrativa aparece en el navegador."
            exit 1
          fi

      - name: Configurar secreto en Cloudflare
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-config.outputs.account_id }}
        run: |
          cd "$APP_DIR"
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | bunx wrangler secret put SUPABASE_SERVICE_ROLE_KEY -c dist/server/wrangler.json

      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare-config.outputs.account_id }}
          workingDirectory: ${{ env.APP_DIR }}
          command: deploy -c dist/server/wrangler.json --keep-vars
