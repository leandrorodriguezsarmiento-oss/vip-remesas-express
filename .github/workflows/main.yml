name: Deploy VIPRemesas (Cloudflare Workers)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
  VITE_PIX_KEY: ${{ vars.VITE_PIX_KEY }}

jobs:
  deploy:
    name: Build and Deploy VIPRemesas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Normalizar enlaces WhatsApp
        run: |
          set -e
          for dir in src portable-export/src; do
            if [ -d "$dir" ]; then
              grep -rlZE 'wa\.me|SUPPORT_WHATSAPP|WHATSAPP_NUMBER' "$dir" --include='*.ts' --include='*.tsx' 2>/dev/null \
                | xargs -0 -r sed -i 's/5595981006775/5595984405698/g'
            fi
          done
          echo "WhatsApp oficial: +55 95 98440-5698"

      - name: Preparar gestor de tasas en el panel admin
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          for path in [Path("src/routes/_authenticated/admin.tsx"), Path("portable-export/src/routes/_authenticated/admin.tsx")]:
              if not path.exists():
                  continue
              text = path.read_text()
              if 'RateCreateCard' not in text:
                  anchor = 'import { usePendingCounts } from "@/hooks/use-pending-counts";'
                  text = text.replace(anchor, anchor + '\nimport { RateCreateCard } from "@/components/RateCreateCard";')
              old = '{isAdmin && tab === "rates" && <RatesTab />}'
              new = '{isAdmin && tab === "rates" && <div className="space-y-3"><RateCreateCard /><RatesTab /></div>}'
              text = text.replace(old, new)
              path.write_text(text)
          PY
          echo "Gestor de tasas preparado: el admin podrá crear nuevas tasas sin modificar código."

      - name: Colocar eliminar cuenta dentro de Ajustes
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          for path in [Path("src/routes/_authenticated/settings.tsx"), Path("portable-export/src/routes/_authenticated/settings.tsx")]:
              if not path.exists():
                  continue
              text = path.read_text()
              if 'DeleteAccountCard' not in text:
                  text = text.replace('import { PushToggle } from "@/components/PushToggle";', 'import { PushToggle } from "@/components/PushToggle";\nimport { DeleteAccountCard } from "@/components/DeleteAccountCard";')
              text = text.replace('      <SupportCard />\n', '      <SupportCard />\n      <DeleteAccountCard />\n')
              path.write_text(text)
          PY
          echo "Eliminar cuenta colocado dentro del contenido de Ajustes."

      - name: Detectar carpeta de la aplicación
        run: |
          if [ -f portable-export/wrangler.jsonc ]; then
            echo "APP_DIR=portable-export" >> "$GITHUB_ENV"
            echo "Aplicación encontrada en portable-export/"
          elif [ -f wrangler.jsonc ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
            echo "Aplicación encontrada en la raíz"
          else
            echo "ERROR: No encuentro wrangler.jsonc"
            exit 1
          fi

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verificar variables públicas
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "ERROR: Falta NEXT_PUBLIC_SUPABASE_URL"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERROR: Falta NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          if [ "$NEXT_PUBLIC_SUPABASE_URL" != "https://nczavdcqueebhhtkuasv.supabase.co" ]; then
            echo "ERROR: NEXT_PUBLIC_SUPABASE_URL no apunta al proyecto nuevo."
            exit 1
          fi
          echo "Variables públicas de Supabase encontradas."

      - name: Verificar y normalizar credenciales Cloudflare
        id: cloudflare-config
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "ERROR: Falta SUPABASE_SERVICE_ROLE_KEY"; exit 1; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "ERROR: Falta CLOUDFLARE_API_TOKEN"; exit 1; fi
          if [ -z "$RAW_CLOUDFLARE_ACCOUNT_ID" ]; then echo "ERROR: Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; fi
          ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n\t ' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          if ! printf '%s' "$ACCOUNT_ID" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID contiene caracteres inválidos. Debe ser únicamente el Account ID, sin comillas ni espacios."
            exit 1
          fi
          if [ -z "$ACCOUNT_ID" ]; then echo "ERROR: CLOUDFLARE_ACCOUNT_ID quedó vacío después de normalizarlo."; exit 1; fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "Credenciales Cloudflare verificadas."

      - name: Instalar dependencias
        run: |
          cd "$APP_DIR"
          bun install

      - name: Compilar producción
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd "$APP_DIR"
          bun run build

      - name: Verificar proyecto Supabase
        run: |
          cd "$APP_DIR"
          EXPECTED_URL="https://nczavdcqueebhhtkuasv.supabase.co"
          if [ ! -d "dist/client" ]; then echo "ERROR: No existe dist/client"; exit 1; fi
          if grep -rqF "uoglxwtritcsrglwimej" dist/client; then echo "ERROR: El build todavía contiene el proyecto Supabase antiguo."; exit 1; fi
          if grep -rqF "$EXPECTED_URL" dist/client; then echo "Proyecto Supabase correcto encontrado."; else echo "ERROR: El navegador no contiene la URL del proyecto nuevo."; exit 1; fi

      - name: Verificar que no se exponga la clave administrativa
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd "$APP_DIR"
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "ERROR: SUPABASE_SERVICE_ROLE_KEY no está disponible."; exit 1; fi
          if grep -rqF "$SUPABASE_SERVICE_ROLE_KEY" dist/client; then echo "ERROR CRÍTICO: La clave administrativa real aparece en dist/client."; exit 1; fi
          echo "Comprobación de seguridad completada."

      - name: Asegurar tasas de México en Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          curl --fail-with-body -sS -X POST "https://nczavdcqueebhhtkuasv.supabase.co/rest/v1/rates?on_conflict=origin_country,method_category,dest_currency" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data '[
              {"origin_country":"MX","origin_currency":"MXN","method_category":"transferencia","dest_currency":"CUP","rate":50,"time_min_minutes":15,"time_max_minutes":60,"min_amount":1,"active":true},
              {"origin_country":"MX","origin_currency":"MXN","method_category":"efectivo","dest_currency":"CUP","rate":35,"time_min_minutes":30,"time_max_minutes":240,"min_amount":1,"active":true},
              {"origin_country":"MX","origin_currency":"MXN","method_category":"transferencia","dest_currency":"MLC","rate":1,"time_min_minutes":15,"time_max_minutes":60,"min_amount":1,"active":true}
            ]'
          echo "Tasas de México aseguradas: transferencia 50 CUP/MXN, efectivo 35 CUP/MXN y MLC 1 MLC/MXN (provisional)."

      - name: Configurar secreto en Cloudflare
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-config.outputs.account_id }}
        run: |
          cd "$APP_DIR"
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | bunx wrangler secret put SUPABASE_SERVICE_ROLE_KEY -c dist/server/wrangler.json

      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare-config.outputs.account_id }}
          workingDirectory: ${{ env.APP_DIR }}
          command: deploy -c dist/server/wrangler.json --keep-vars
