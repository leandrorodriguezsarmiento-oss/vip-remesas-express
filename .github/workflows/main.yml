name: Deploy VIPRemesas (Cloudflare Workers)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://nczavdcqueebhhtkuasv.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rxqHb79-KneH3UZGHj2fDA_5ofGaUds
  VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
  VITE_PIX_KEY: ${{ vars.VITE_PIX_KEY }}

jobs:
  deploy:
    name: Build and Deploy VIPRemesas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Asegurar PIX manual y eliminar Mercado Pago del flujo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [
              Path("src/routes/_authenticated/send.tsx"),
              Path("portable-export/src/routes/_authenticated/send.tsx"),
          ]

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text()

              # Imports/estado de Mercado Pago.
              text = text.replace('import { createMercadoPagoPreference } from "@/lib/mercadopago.functions";\n', '')
              text = text.replace('import { createMercadoPagoPreference } from "@/lib/payments.functions";\n', '')
              text = text.replace('  const createMpPreference = useServerFn(createMercadoPagoPreference);\n', '')
              text = text.replace('  const [mpLoading, setMpLoading] = useState(false);\n', '')

              # Eliminar la función completa de Mercado Pago.
              start = text.find('  async function payWithMercadoPago')
              end = text.find('  async function confirmPaid', start)
              if start >= 0 and end > start:
                  text = text[:start] + text[end:]

              # Sustituir cualquier bloque BR que cree PIX dinámico por el pixCode
              # que ya genera createTransaction con la llave fija y el monto exacto.
              marker = '      setTracking(res.trackingId);\n      setTxId(res.transactionId);'
              pos = text.find(marker)
              if pos >= 0:
                  end_marker = '      setStep(6);\n      if (origin !== "BR") openWhatsApp(res.trackingId);'
                  end = text.find(end_marker, pos)
                  if end > pos:
                      replacement = marker + '\n      setPixCode(res.pixCode);\n\n      // Brasil: PIX fijo de VIP Remesas con el monto exacto incluido.\n      // No se llama a Mercado Pago.\n\n'
                      text = text[:pos] + replacement + text[end:]

              # Eliminar botón de pago de Mercado Pago si existe.
              while 'onClick={payWithMercadoPago}' in text:
                  b = text.rfind('{origin === "BR"', 0, text.find('onClick={payWithMercadoPago}'))
                  e = text.find('</button>}', text.find('onClick={payWithMercadoPago}'))
                  if b < 0 or e < 0:
                      break
                  text = text[:b] + text[e + len('</button>}') :]

              text = text.replace('Paga por PIX de Mercado Pago — el monto exacto ya viene incluido', 'Paga por PIX — el monto exacto ya viene incluido')
              text = text.replace('Pagar con Mercado Pago', 'Pagar con PIX')
              text = text.replace('PIX de Mercado Pago generado. Escanea el QR o copia el código.', 'PIX generado. Escanea el QR o copia el código.')
              text = text.replace('Aviso recibido. La confirmación del pago se hará automáticamente con Mercado Pago.', 'Pago informado. Lo verificaremos manualmente antes de procesar la remesa.')
              text = text.replace('Al verificar se abrirá WhatsApp para enviarnos el comprobante de pago.', 'Después de pulsar “Ya pagué”, confirma tu pago por WhatsApp al +55 95984405698.')
              text = text.replace('Ya pagué, verificar', 'Ya pagué')
              text = text.replace('CreditCard, ', '')
              text = text.replace(', CreditCard', '')
              path.write_text(text)

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text()
              forbidden = ["createMercadoPagoPreference", "payWithMercadoPago", "Pagar con Mercado Pago", "PIX de Mercado Pago", "createMpPreference"]
              hits = [x for x in forbidden if x in text]
              if hits:
                  raise SystemExit(f"ERROR: Mercado Pago sigue en {path}: {hits}")
          PY

      - name: Detectar carpeta de la aplicación
        run: |
          if [ -f portable-export/wrangler.jsonc ]; then
            echo "APP_DIR=portable-export" >> "$GITHUB_ENV"
          elif [ -f wrangler.jsonc ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: No encuentro wrangler.jsonc"
            exit 1
          fi

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verificar variables públicas
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || exit 1
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || exit 1
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://nczavdcqueebhhtkuasv.supabase.co" || exit 1

      - name: Verificar credenciales
        id: cloudflare-config
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || exit 1
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$RAW_CLOUDFLARE_ACCOUNT_ID" || exit 1
          ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n\t ' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          printf '%s' "$ACCOUNT_ID" | grep -Eq '^[A-Za-z0-9_-]+$' || exit 1
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        run: cd "$APP_DIR" && bun install

      - name: Compilar producción
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: cd "$APP_DIR" && bun run build

      - name: Verificar build y seguridad
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd "$APP_DIR"
          test -d dist/client || exit 1
          if grep -rqF "uoglxwtritcsrglwimej" dist/client; then exit 1; fi
          grep -rqF "https://nczavdcqueebhhtkuasv.supabase.co" dist/client || exit 1
          if grep -rqF "createMercadoPagoPreference" dist/client; then echo "Mercado Pago en build"; exit 1; fi
          if grep -rqF "Pagar con Mercado Pago" dist/client; then echo "UI Mercado Pago en build"; exit 1; fi
          if grep -rqF "$SUPABASE_SERVICE_ROLE_KEY" dist/client; then echo "Clave admin en navegador"; exit 1; fi

      - name: Configurar secreto en Cloudflare
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-config.outputs.account_id }}
        run: |
          cd "$APP_DIR"
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | bunx wrangler secret put SUPABASE_SERVICE_ROLE_KEY -c dist/server/wrangler.json

      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare-config.outputs.account_id }}
          workingDirectory: ${{ env.APP_DIR }}
          command: deploy -c dist/server/wrangler.json --keep-vars
