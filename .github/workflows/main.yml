name: Deploy VIPRemesas (Cloudflare Workers)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://nczavdcqueebhhtkuasv.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rxqHb79-KneH3UZGHj2fDA_5ofGaUds
  VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
  VITE_PIX_KEY: ${{ vars.VITE_PIX_KEY }}

jobs:
  deploy:
    name: Build and Deploy VIPRemesas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Forzar flujo PIX manual
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("src/routes/_authenticated/send.tsx"),
              Path("portable-export/src/routes/_authenticated/send.tsx"),
          ]

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text()
              text = re.sub(r'import \{ createMercadoPagoPreference \} from "@/lib/(mercadopago|payments)\.functions";\n', '', text)
              text = re.sub(r'\n\s*const createMpPreference = useServerFn\(createMercadoPagoPreference\);', '', text)
              text = re.sub(r'\n\s*const \[mpLoading, setMpLoading\] = useState\(false\);', '', text)
              text = re.sub(r'\n  async function payWithMercadoPago\(\) \{.*?\n  \}\n\n  async function confirmPaid', '\n\n  async function confirmPaid', text, flags=re.S)
              text = text.replace('  const WHATSAPP_NUMBER = "5595981006775";', '  const WHATSAPP_NUMBER = "5595981006775";')
              text = text.replace('const pixPayCode = pixCode;', 'const pixPayCode = pixCode;')

              # Root and portable variants both get the same manual-PIX order result.
              text = re.sub(
                  r'      setTracking\(res\.trackingId\);\n      setTxId\(res\.transactionId\);\n.*?      setStep\(6\);\n      if \(origin !== "BR"\) openWhatsApp\(res\.trackingId\);',
                  '      setTracking(res.trackingId);\n      setTxId(res.transactionId);\n      setPixCode(res.pixCode);\n\n      // Brasil: PIX fijo de VIP Remesas con el monto exacto incluido.\n      // No se llama a Mercado Pago.\n      setStep(6);\n      if (origin !== "BR") openWhatsApp(res.trackingId);',
                  text,
                  flags=re.S,
              )
              text = text.replace('Pagar con Mercado Pago', 'Pagar con PIX')
              text = text.replace('Paga por PIX de Mercado Pago — el monto exacto ya viene incluido', 'Paga por PIX — el monto exacto ya viene incluido')
              text = text.replace('PIX de Mercado Pago generado. Escanea el QR o copia el código.', 'PIX generado. Escanea el QR o copia el código.')
              text = text.replace('Aviso recibido. La confirmación del pago se hará automáticamente con Mercado Pago.', 'Pago informado. Lo verificaremos manualmente antes de procesar la remesa.')
              text = text.replace('Al verificar se abrirá WhatsApp para enviarnos el comprobante de pago.', 'Después de pulsar “Ya pagué”, confirma tu pago por WhatsApp al +55 95984405698.')
              text = text.replace('Ya pagué, verificar', 'Ya pagué')
              text = text.replace('CreditCard, ', '')
              text = text.replace(', CreditCard', '')
              path.write_text(text)

          for path in files:
              if path.exists():
                  text = path.read_text()
                  forbidden = ["createMercadoPagoPreference", "payWithMercadoPago", "Pagar con Mercado Pago", "PIX de Mercado Pago"]
                  hits = [x for x in forbidden if x in text]
                  if hits:
                      raise SystemExit(f"ERROR: Mercado Pago sigue en {path}: {hits}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/send.tsx portable-export/src/routes/_authenticated/send.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Switch remittances to fixed manual PIX"
            git push
          fi

      - name: Detectar carpeta de la aplicación
        run: |
          if [ -f portable-export/wrangler.jsonc ]; then
            echo "APP_DIR=portable-export" >> "$GITHUB_ENV"
          elif [ -f wrangler.jsonc ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: No encuentro wrangler.jsonc"
            exit 1
          fi

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verificar variables públicas
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "ERROR: Falta NEXT_PUBLIC_SUPABASE_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "ERROR: Falta NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://nczavdcqueebhhtkuasv.supabase.co" || { echo "ERROR: Supabase incorrecto"; exit 1; }

      - name: Verificar credenciales
        id: cloudflare-config
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "ERROR: Falta SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "ERROR: Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$RAW_CLOUDFLARE_ACCOUNT_ID" || { echo "ERROR: Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          ACCOUNT_ID="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n\t ' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          printf '%s' "$ACCOUNT_ID" | grep -Eq '^[A-Za-z0-9_-]+$' || { echo "ERROR: CLOUDFLARE_ACCOUNT_ID inválido"; exit 1; }
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        run: |
          cd "$APP_DIR"
          bun install

      - name: Compilar producción
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd "$APP_DIR"
          bun run build

      - name: Verificar build y seguridad
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd "$APP_DIR"
          test -d dist/client || { echo "ERROR: No existe dist/client"; exit 1; }
          if grep -rqF "uoglxwtritcsrglwimej" dist/client; then echo "ERROR: Supabase antiguo en build"; exit 1; fi
          grep -rqF "https://nczavdcqueebhhtkuasv.supabase.co" dist/client || { echo "ERROR: Supabase actual ausente"; exit 1; }
          if grep -rqF "createMercadoPagoPreference" dist/client; then echo "ERROR: Mercado Pago quedó en el navegador"; exit 1; fi
          if grep -rqF "Pagar con Mercado Pago" dist/client; then echo "ERROR: UI de Mercado Pago quedó en el build"; exit 1; fi
          if grep -rqF "$SUPABASE_SERVICE_ROLE_KEY" dist/client; then echo "ERROR CRÍTICO: clave administrativa en navegador"; exit 1; fi

      - name: Configurar secreto en Cloudflare
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare-config.outputs.account_id }}
        run: |
          cd "$APP_DIR"
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | bunx wrangler secret put SUPABASE_SERVICE_ROLE_KEY -c dist/server/wrangler.json

      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cloudflare-config.outputs.account_id }}
          workingDirectory: ${{ env.APP_DIR }}
          command: deploy -c dist/server/wrangler.json --keep-vars
