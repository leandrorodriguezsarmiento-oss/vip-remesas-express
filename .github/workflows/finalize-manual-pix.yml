name: Finalize manual PIX mode

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the last known manual PIX state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit 118d3ea5b0190e2ec30f0b401b9cc63b942a49ae
          git rm -f .github/workflows/fix-pix-freeze.yml .github/workflows/fix-manual-pix-now.yml .github/workflows/finalize-manual-pix.yml 2>/dev/null || true
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize manual production PIX flow"
            git push
          fi